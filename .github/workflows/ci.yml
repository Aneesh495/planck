name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install nasm
        run: sudo apt-get update && sudo apt-get install -y nasm binutils make
      - name: build
        run: make
      - name: unit tests
        run: ./bin/planck test
      - name: exit0
        run: ./bin/planck run programs/exit0.s
      - name: fib functional
        run: ./bin/planck run programs/fib.s
      - name: fib ooo
        run: ./bin/planck run --mode ooo --stats programs/fib.s
      - name: fact
        run: ./bin/planck run programs/fact.s
      - name: memsmoke
        run: |
          ./bin/planck asm programs/memsmoke.s
          ./bin/planck run --dump-regs programs/memsmoke.s
      - name: lasmoke
        run: |
          ./bin/planck asm programs/lasmoke.s
          ./bin/planck run --dump-regs programs/lasmoke.s
      - name: memcpy
        run: |
          ./bin/planck asm programs/memcpy.s
          ./bin/planck run --dump-regs programs/memcpy.s
      - name: callret
        run: ./bin/planck run programs/callret.s
      - name: isort
        run: ./bin/planck run programs/isort.s
      - name: matmul
        run: ./bin/planck run programs/matmul.s
      - name: branchy
        run: ./bin/planck run programs/branchy.s
      - name: crc32
        run: ./bin/planck run programs/crc32.s
      - name: fib recursive
        run: |
          ./bin/planck asm programs/fib_rec.s
          ./bin/planck run --dump-regs programs/fib_rec.s
